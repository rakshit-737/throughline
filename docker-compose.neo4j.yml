# Optional local Neo4j mirror of the knowledge graph (POST /neo4j/sync). There is no default
# password: generate one, e.g.
#   export NEO4J_PASSWORD=$(python -c "import secrets;print(secrets.token_urlsafe(24))")
#   docker compose -f docker-compose.yml -f docker-compose.neo4j.yml up --build
services:
  throughline:
    environment:
      THROUGHLINE_NEO4J_URI: bolt://neo4j:7687
      THROUGHLINE_NEO4J_USER: neo4j
      THROUGHLINE_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD (see the comment at the top of docker-compose.neo4j.yml)}
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26.31-community@sha256:d9cfe82983d27f5a75b3aaae8f316d04f9a698a3b7f6103a508f7caf8362f255
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD (see the comment at the top of docker-compose.neo4j.yml)}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
