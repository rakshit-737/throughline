<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THROUGHLINE console</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2de; --accent:#2f5d8a; --warn:#a4491f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececec; --muted:#9a9aa0; --line:#2e2e33; --accent:#7fb0e0; --warn:#e39a6f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  header .mode { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(220px, 300px) 1fr minmax(240px, 340px); gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  input { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); }
  .inc { padding:6px 4px; border-bottom:1px solid var(--line); cursor:pointer; word-break:break-all; }
  .inc:hover { background:var(--bg); }
  .score { font-variant-numeric: tabular-nums; color:var(--accent); font-weight:600; }
  pre { white-space:pre-wrap; word-break:break-word; font:12.5px/1.5 ui-monospace, monospace; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { text-align:left; padding:4px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  a.claim { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .gap { color:var(--warn); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header><h1>THROUGHLINE</h1><span class="mode" id="mode"></span></header>
<main>
  <section>
    <h2>Incidents</h2>
    <input id="q" placeholder="entity or incident, e.g. checkout-7" aria-label="investigate entity">
    <div id="incidents" class="muted" style="margin-top:8px">loading...</div>
  </section>
  <section>
    <h2>Investigation</h2>
    <div id="hyps"></div>
    <pre id="report" class="muted">Pick an incident or type an entity and press Enter.</pre>
    <h2 style="margin-top:14px">Facts (every one cites claims)</h2>
    <table id="facts"></table>
  </section>
  <section>
    <h2>Why this confidence?</h2>
    <pre id="explain" class="muted">Click a claim id.</pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
function claimLinks(ids) { return (ids || []).slice(0, 4).map((c) => `<a class="claim" data-c="${esc(c)}">${esc(c)}</a>`).join(" "); }
async function explain(cid) { try { $("explain").textContent = JSON.stringify(await j(`/claims/${encodeURIComponent(cid)}/explain`), null, 2); } catch (e) { $("explain").textContent = e.message; } }
document.addEventListener("click", (e) => { const c = e.target.closest("a.claim"); if (c) explain(c.dataset.c); });
async function run(query) {
  $("report").textContent = "investigating...";
  try {
    const a = await j(`/investigator/${encodeURIComponent(query)}`);
    $("report").innerHTML = esc(a.report).replace(/\b(c\d{5})\b/g, '<a class="claim" data-c="$1">$1</a>');
    $("hyps").innerHTML = a.hypotheses.map((h) => `<div>${h.belief < 0.5 && h.id === "coverage" ? '<span class="gap">gap</span> ' : ""}<span class="score">${h.belief.toFixed(2)}</span> ${esc(h.statement)}</div>`).join("");
    const f = await j(`/investigate/${encodeURIComponent(a.incident || a.entity)}`);
    $("facts").innerHTML = "<tr><th>conf</th><th>fact</th><th>claims</th></tr>" + f.facts.slice(0, 80).map((x) =>
      `<tr><td class="score">${x.confidence.toFixed(2)}</td><td>${esc(x.subject)} <b>${esc(x.predicate)}</b> ${esc(x.object)}</td><td>${claimLinks(x.claims)}</td></tr>`).join("");
  } catch (e) { $("report").textContent = e.message; }
}
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.value.trim()) run(e.target.value.trim()); });
(async () => {
  const h = await j("/health"); $("mode").textContent = `${h.mode} - ${h.nodes} nodes, ${h.claims} claims`;
  const incs = await j("/incidents");
  $("incidents").innerHTML = incs.length ? incs.map((i) => `<div class="inc" data-i="${esc(i.incident)}"><span class="score">${i.score.toFixed(2)}</span> ${esc(i.incident)}<div class="muted">${i.alerts} alerts, ${Object.keys(i.technique_conf).length} techniques</div></div>`).join("")
    : "No correlated incidents (synthetic mode): try checkout-7.";
  document.querySelectorAll(".inc").forEach((el) => el.addEventListener("click", () => run(el.dataset.i)));
})();
</script>
</body>
</html>
