<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THROUGHLINE console</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2de; --accent:#2f5d8a; --warn:#a4491f; --focus:#2f5d8a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececec; --muted:#9a9aa0; --line:#2e2e33; --accent:#7fb0e0; --warn:#e39a6f; --focus:#7fb0e0; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  header .mode { color:var(--muted); }
  header .spacer { flex:1; }
  header a { color:var(--accent); }
  select, input { padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); font:inherit; }
  main { display:grid; grid-template-columns: minmax(220px, 300px) 1fr minmax(240px, 340px); gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  #q { width:100%; }
  .row { display:flex; gap:6px; margin-top:6px; }
  .row input { flex:1; min-width:0; }
  button.inc { display:block; width:100%; text-align:left; padding:6px 4px; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; word-break:break-all; }
  button.inc:hover, button.inc[aria-current="true"] { background:var(--bg); }
  button.claim { border:0; background:none; padding:0; color:var(--accent); text-decoration:underline; cursor:pointer; font:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .score { font-variant-numeric: tabular-nums; color:var(--accent); font-weight:600; }
  pre { white-space:pre-wrap; word-break:break-word; font:12.5px/1.5 ui-monospace, monospace; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { text-align:left; padding:4px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  th { white-space:nowrap; word-break:normal; }
  .gap { color:var(--warn); }
  .muted { color:var(--muted); }
  .hint { margin-top:8px; font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>THROUGHLINE</h1><span class="mode" id="mode"></span><span class="spacer"></span>
  <label id="worldbox" hidden>world <select id="world" aria-label="demo world"></select></label>
  <a id="docs" href="../" hidden>Documentation</a>
</header>
<main>
  <section aria-labelledby="h-inc">
    <h2 id="h-inc">Incidents</h2>
    <form id="qf" class="row" role="search">
      <input id="q" placeholder="entity or incident, e.g. checkout-7" aria-label="investigate entity">
    </form>
    <div id="asofbox" class="row" hidden>
      <input id="asof" placeholder="as of, e.g. 2026-01-05T10:05:00Z" aria-label="answer as of this time (ISO-8601)">
    </div>
    <div id="incidents" class="muted" style="margin-top:8px">loading...</div>
  </section>
  <section aria-labelledby="h-inv">
    <h2 id="h-inv">Investigation</h2>
    <div id="hyps"></div>
    <pre id="report" class="muted" aria-live="polite">Pick an incident or type an entity and press Enter.</pre>
    <h2 style="margin-top:14px">Facts (every one cites claims)</h2>
    <table id="facts"></table>
  </section>
  <section aria-labelledby="h-exp">
    <h2 id="h-exp">Why this confidence?</h2>
    <pre id="explain" class="muted" aria-live="polite">Select a claim id.</pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("token");
// static mode (docs site): responses were pre-rendered by scripts/build_static_demo.py
const STATIC = document.documentElement.dataset.static;
let base = STATIC || "";
const skey = (url) => decodeURIComponent(url).replace(/[^A-Za-z0-9._-]/g, "_");
function asOf(url) { const t = !STATIC && $("asof").value.trim(); return t ? url + (url.includes("?") ? "&" : "?") + "as_of=" + encodeURIComponent(t) : url; }
async function j(url) {
  if (STATIC) { const r = await fetch(base + skey(url) + ".json"); if (!r.ok) throw new Error("not pre-rendered in the static demo: run `throughline serve` for live queries"); return r.json(); }
  const r = await fetch(asOf(url), TOKEN ? {headers: {Authorization: "Bearer " + TOKEN}} : {}); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const claimBtn = (c) => `<button type="button" class="claim" data-c="${esc(c)}">${esc(c)}</button>`;
async function explain(cid) { try { $("explain").textContent = JSON.stringify(await j(`/claims/${encodeURIComponent(cid)}/explain`), null, 2); } catch (e) { $("explain").textContent = e.message; } }
document.addEventListener("click", (e) => {
  const c = e.target.closest("button.claim"); if (c) { explain(c.dataset.c); return; }
  const i = e.target.closest("button.inc"); if (i) { document.querySelectorAll("button.inc").forEach((b) => b.removeAttribute("aria-current")); i.setAttribute("aria-current", "true"); run(i.dataset.i); }
});
async function run(query) {
  $("report").textContent = "investigating...";
  try {
    const a = await j(`/investigator/${encodeURIComponent(query)}`);
    $("report").innerHTML = esc(a.report).replace(/\b(c\d{5})\b/g, (m) => claimBtn(m));
    $("hyps").innerHTML = a.hypotheses.map((h) => `<div>${h.belief < 0.5 && h.id === "coverage" ? '<span class="gap">gap</span> ' : ""}<span class="score">${h.belief.toFixed(2)}</span> ${esc(h.statement)}</div>`).join("");
    const f = await j(`/investigate/${encodeURIComponent(a.incident || a.entity)}`);
    $("facts").innerHTML = "<tr><th>conf</th><th>fact</th><th>claims</th></tr>" + f.facts.slice(0, 80).map((x) =>
      `<tr><td class="score">${x.confidence.toFixed(2)}</td><td>${esc(x.subject)} <b>${esc(x.predicate)}</b> ${esc(x.object)}</td><td>${(x.claims || []).slice(0, 4).map(claimBtn).join(" ")}</td></tr>`).join("");
    const first = f.facts.find((x) => x.claims && x.claims.length); if (first && STATIC) explain(first.claims[0]);
  } catch (e) { $("report").textContent = e.message; }
}
$("qf").addEventListener("submit", (e) => { e.preventDefault(); const v = $("q").value.trim(); if (v) run(v); });
$("asof").addEventListener("change", () => load());
async function load() {
  try {
    const h = await j("/health"); $("mode").textContent = `${h.mode} - ${h.nodes} nodes, ${h.claims} claims`;
    const incs = await j("/incidents");
    const hint = h.mode.startsWith("synthetic") ? `<div class="hint">No correlated incidents in the synthetic world: <button type="button" class="inc" data-i="checkout-7">investigate checkout-7</button></div>` : "";
    $("incidents").innerHTML = incs.length ? incs.map((i) => `<button type="button" class="inc" data-i="${esc(i.incident)}"><span class="score">${i.score.toFixed(2)}</span> ${esc(i.incident)}<div class="muted">${i.alerts} alerts, ${Object.keys(i.technique_conf).length} techniques</div></button>`).join("") : hint;
    const first = document.querySelector("button.inc"); if (first) first.click();
  } catch (e) { $("incidents").textContent = e.message; }
}
(async () => {
  if (STATIC) {
    $("docs").hidden = false;
    try {
      const worlds = await (await fetch(STATIC + "worlds.json")).json();
      $("world").innerHTML = worlds.map((w) => `<option value="${esc(w.id)}">${esc(w.title)}</option>`).join("");
      $("worldbox").hidden = false;
      base = STATIC + worlds[0].id + "/";
      $("world").addEventListener("change", (e) => { base = STATIC + e.target.value + "/"; $("explain").textContent = "Select a claim id."; load(); });
    } catch (e) { /* single-world static build */ }
  } else { $("asofbox").hidden = false; }
  load();
})();
</script>
</body>
</html>
