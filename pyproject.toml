[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "1.0.0"
description = "Evidence-first security knowledge graph that fuses sibling engines (Sigma, provenance, ACH attribution, posture) into one confidence-graded investigation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]
keywords = ["security", "knowledge-graph", "mitre-attack", "threat-intelligence", "incident-response",
            "sigma", "provenance", "attribution"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
neo4j = ["neo4j>=5.0"]
# The sibling portfolio projects, as capability engines, pinned to validated commits.
engines = [
  "anvil-dac @ git+https://github.com/rakshit-737/anvil@v1.0.0",
  "revenant @ git+https://github.com/rakshit-737/revenant@v1.0.0",
  "rootline @ git+https://github.com/rakshit-737/rootline@v1.0.0",
  "dragnet @ git+https://github.com/rakshit-737/dragnet@v1.0.0",
  "occam @ git+https://github.com/rakshit-737/occam@v1.0.0",
  "vantage @ git+https://github.com/rakshit-737/vantage@v1.0.0",
  "gauntlet @ git+https://github.com/rakshit-737/gauntlet@v1.0.0",
  "tracegate @ git+https://github.com/rakshit-737/tracegate@v1.0.0",
  "stratum @ git+https://github.com/rakshit-737/stratum@v1.0.0",
  "linchpin @ git+https://github.com/rakshit-737/linchpin@v1.0.0",
  "specimen @ git+https://github.com/rakshit-737/specimen@v1.0.0",
  "vitrine @ git+https://github.com/rakshit-737/vitrine@v1.0.0",
  "openpyxl>=3.1",
]
# FEINT pulls xgboost/pandas; kept separate so the engines extra stays light.
network = ["feint @ git+https://github.com/rakshit-737/feint@v1.0.0"]
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/rakshit-737/throughline"
Documentation = "https://rakshit-737.github.io/throughline/"

[project.scripts]
throughline = "throughline.cli:main"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.setuptools.package-data]
throughline = ["ui/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "realdata: needs the downloaded datasets (scripts/download_data.py); skipped when absent",
  "engines: needs the sibling engines (pip install -e .[engines]); skipped when absent",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
