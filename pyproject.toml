[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "1.0.0"
description = "Evidence-first security knowledge graph that fuses sibling engines (Sigma, provenance, ACH attribution, posture) into one confidence-graded investigation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]
keywords = ["security", "knowledge-graph", "mitre-attack", "threat-intelligence", "incident-response",
            "sigma", "provenance", "attribution"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
neo4j = ["neo4j>=5.0"]
# The sibling portfolio projects, as capability engines, pinned to validated commits.
engines = [
  "anvil-dac @ git+https://github.com/rakshit-737/anvil@c8cf57f571c4b347709cef042c0a382824cb9466",
  "revenant @ git+https://github.com/rakshit-737/revenant@624be3f3082419e3323bfc9b3dcdad76290103ef",
  "rootline @ git+https://github.com/rakshit-737/rootline@7f25f29d6eeb9211c52349cb6740bf0cb01fb7f4",
  "dragnet @ git+https://github.com/rakshit-737/dragnet@8583ebb14a61d3a538f13aff3b0eb825dd4f8bd2",
  "occam @ git+https://github.com/rakshit-737/occam@6fda4cc409b61c661060baf6e1df3f387e556d45",
  "vantage @ git+https://github.com/rakshit-737/vantage@945eb3860244a3c3650f4ee0042adccc064e88e5",
  "gauntlet @ git+https://github.com/rakshit-737/gauntlet@8ff400ccaa54efc247d15ef85412ba0b9e04ac25",
  "tracegate @ git+https://github.com/rakshit-737/tracegate@014faa3839544ae9ab95538199e80291a95cc9cb",
  "stratum @ git+https://github.com/rakshit-737/stratum@1341f1c9633636339b4190c8cd6679533702fcf0",
  "linchpin @ git+https://github.com/rakshit-737/linchpin@dc16710d7f07be2bde7fbfcf29dd31bfe798de04",
  "specimen @ git+https://github.com/rakshit-737/specimen@e3dc7de3b0f68f4b86ced41eb7bd8b0389a9a99a",
  "vitrine @ git+https://github.com/rakshit-737/vitrine@76ee8dd8011a5764a86c0b22a7782b11cc863220",
  "openpyxl>=3.1",
]
# FEINT pulls xgboost/pandas; kept separate so the engines extra stays light.
network = ["feint @ git+https://github.com/rakshit-737/feint@ff76b5c82c77d876279d1a06e04422627da46b4a"]
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/rakshit-737/throughline"
Documentation = "https://rakshit-737.github.io/throughline/"

[project.scripts]
throughline = "throughline.cli:main"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.setuptools.package-data]
throughline = ["ui/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "realdata: needs the downloaded datasets (scripts/download_data.py); skipped when absent",
  "engines: needs the sibling engines (pip install -e .[engines]); skipped when absent",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
