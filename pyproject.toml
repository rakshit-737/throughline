[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "1.0.0"
description = "Evidence-first security knowledge graph that fuses sibling engines (Sigma, provenance, ACH attribution, posture) into one confidence-graded investigation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
requires-python = ">=3.11"
dependencies = ["networkx>=3.6.1", "PyYAML>=6.0.3"]
keywords = ["security", "knowledge-graph", "mitre-attack", "threat-intelligence", "incident-response",
            "sigma", "provenance", "attribution"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.optional-dependencies]
# >=0.132: strict JSON Content-Type checking on request bodies (cross-site no-cors POSTs are rejected)
api = ["fastapi>=0.142.1", "uvicorn>=0.54.0", "httpx>=0.28.1"]
neo4j = ["neo4j>=6.3.1"]
# The sibling portfolio projects as capability engines, pinned to release tags. The direct URLs
# are deliberate: unrelated PyPI projects own the bare names dragnet, linchpin, revenant, ...
# Three siblings renamed their distributions at v1.1.0 (dragnet-attribution, gauntlet-coverage,
# linchpin-attackpath); the import packages are unchanged. Keep in sync with
# throughline.engines.SIBLINGS (tests/test_engines.py checks) and scripts/check_sibling_tags.py.
engines = [
  "anvil-dac @ git+https://github.com/rakshit-737/anvil@v1.1.0",
  "revenant @ git+https://github.com/rakshit-737/revenant@v1.1.0",
  "rootline @ git+https://github.com/rakshit-737/rootline@v1.1.0",
  "dragnet-attribution @ git+https://github.com/rakshit-737/dragnet@v1.1.0",
  "occam @ git+https://github.com/rakshit-737/occam@v1.1.0",
  "vantage @ git+https://github.com/rakshit-737/vantage@v1.1.0",
  "gauntlet-coverage @ git+https://github.com/rakshit-737/gauntlet@v1.1.0",
  "tracegate @ git+https://github.com/rakshit-737/tracegate@v1.1.0",
  "stratum @ git+https://github.com/rakshit-737/stratum@v1.1.0",
  "linchpin-attackpath @ git+https://github.com/rakshit-737/linchpin@v1.1.0",
  "specimen @ git+https://github.com/rakshit-737/specimen@v1.1.0",
  "vitrine @ git+https://github.com/rakshit-737/vitrine@v1.1.0",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
]
# FEINT pulls xgboost/pandas; kept separate so the engines extra stays light.
network = ["feint @ git+https://github.com/rakshit-737/feint@v1.0.0"]
bench = ["matplotlib>=3.11.2", "psutil>=7.2.2"]
dev = ["pytest>=9.1.1", "ruff==0.16.10", "fastapi>=0.142.1", "httpx>=0.28.1", "httpx2>=2.13.1"]
docs = ["mkdocs-material>=9.7.7,<10", "mkdocstrings[python]>=1.0.6,<2", "httpx2>=2.13.1"]

[project.urls]
Repository = "https://github.com/rakshit-737/throughline"
Documentation = "https://rakshit-737.github.io/throughline/"

[project.scripts]
throughline = "throughline.cli:main"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.setuptools.package-data]
throughline = ["ui/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "realdata: needs the downloaded datasets (scripts/download_data.py); skipped when absent",
  "engines: needs the sibling engines (pip install -e .[engines]); skipped when absent",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
