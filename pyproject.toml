[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "1.1.2"
description = "Evidence-first security knowledge graph that fuses sibling engines (Sigma, provenance, ACH attribution, posture) into one confidence-graded investigation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
requires-python = ">=3.11"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]
keywords = ["security", "knowledge-graph", "mitre-attack", "threat-intelligence", "incident-response",
            "sigma", "provenance", "attribution"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.optional-dependencies]
# >=0.132: strict JSON Content-Type checking on request bodies (cross-site no-cors POSTs are rejected)
api = ["fastapi>=0.132", "uvicorn>=0.29", "httpx>=0.27"]
neo4j = ["neo4j>=5.0"]
# The sibling portfolio projects as capability engines, pinned to release tags. The direct URLs
# are deliberate: unrelated PyPI projects own the bare names dragnet, linchpin, revenant, ...
# Three siblings renamed their distributions at v1.1.0 (dragnet-attribution, gauntlet-coverage,
# linchpin-attackpath); the import packages are unchanged. Keep in sync with
# throughline.engines.SIBLINGS (tests/test_engines.py checks) and scripts/check_sibling_tags.py.
engines = [
  "anvil-dac @ git+https://github.com/rakshit-737/anvil-detection-engineering@v1.1.2",
  "revenant @ git+https://github.com/rakshit-737/revenant-dfir-timeline@v1.1.3",
  "rootline @ git+https://github.com/rakshit-737/rootline-provenance-forensics@v1.1.2",
  "dragnet-attribution @ git+https://github.com/rakshit-737/dragnet-actor-attribution@v1.1.3",
  "occam @ git+https://github.com/rakshit-737/occam-cti-attribution@v1.1.3",
  "vantage @ git+https://github.com/rakshit-737/vantage-compliance-attack-mapping@v1.1.2",
  "gauntlet-coverage @ git+https://github.com/rakshit-737/gauntlet-detection-coverage@v1.1.2",
  "tracegate @ git+https://github.com/rakshit-737/tracegate-cicd-security-gate@v1.1.2",
  "stratum-cnapp @ git+https://github.com/rakshit-737/stratum-cloud-security@v1.1.3",
  "linchpin-attackpath @ git+https://github.com/rakshit-737/linchpin-attack-path-analysis@v1.1.3",
  "specimen @ git+https://github.com/rakshit-737/specimen-malware-analysis@v1.1.4",
  "vitrine @ git+https://github.com/rakshit-737/vitrine-malware-triage@v1.1.3",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]
# FEINT pulls xgboost/pandas; kept separate so the engines extra stays light.
network = ["feint @ git+https://github.com/rakshit-737/feint-adversarial-ids@v1.1.2"]
bench = ["matplotlib>=3.8", "psutil>=5.9"]
dev = ["pytest>=8", "ruff==0.16.10", "fastapi>=0.132", "httpx>=0.27", "httpx2>=2.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocs-redirects>=1.2,<2", "mkdocstrings[python]>=0.25,<2", "httpx2>=2.0"]

[project.urls]
Repository = "https://github.com/rakshit-737/throughline-security-knowledge-graph"
Documentation = "https://rakshit-737.github.io/throughline-security-knowledge-graph/"

[project.scripts]
throughline = "throughline.cli:main"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.setuptools.package-data]
throughline = ["ui/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "realdata: needs the downloaded datasets (scripts/download_data.py); skipped when absent",
  "engines: needs the sibling engines (pip install -e .[engines]); skipped when absent",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# S = flake8-bandit (static security checks); the per-file ignores below are reviewed false positives
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]                                   # asserts, fixed test tokens and paths
"benchmarks/**" = ["S311", "S603", "S607"]           # seeded RNG for statistics; fixed `git rev-parse`
"scripts/**" = ["S106", "S310", "S324", "S603", "S607"]  # fixed https URLs and commands; git blob ids are SHA-1 by definition; a CI-only wrong-token probe
"throughline/synth.py" = ["S108", "S311"]            # synthetic data: a seeded generator and a "/tmp/.x" string in a fake event
"throughline/attack.py" = ["S108"]                   # "/tmp/" and "/dev/shm/" are keywords of the ATT&CK event mapping, not paths we write
