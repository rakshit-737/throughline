name: release
# On a v* tag: preflight (version, changelog, sibling pins, repo hygiene) and the full CI
# suite must pass before anything is built or published. Only the final job holds write
# permissions.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: tag equals the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          test "$(python -c 'import throughline;print(throughline.__version__)')" = "$v"
      - name: CITATION.cff cites this version
        run: |
          grep -qx "version: ${GITHUB_REF_NAME#v}" CITATION.cff || { echo "CITATION.cff version is not ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: CHANGELOG has a section for this version
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}"
      - name: committed results were produced by the pinned engines
        # if a sibling the benchmarks use moved, re-run `gh workflow run bench.yml -f which=all`
        # and commit its results before tagging
        run: python benchmarks/check_results.py --which all --pins
      - name: sibling pins are their newest published releases and no pinned tag moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_sibling_tags.py
      - name: repository hygiene (no file over 1 MB, no bidi controls)
        run: |
          python -m pip install -q pyyaml
          python scripts/repo_lint.py
  tests:
    uses: ./.github/workflows/ci.yml
  build:
    needs: [preflight, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build wheel and sdist
        run: pip install "build==1.3.0" && python -m build
      - name: smoke-test the wheel in a fresh venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/throughline --help
          /tmp/wheel-venv/bin/throughline demo
          /tmp/wheel-venv/bin/throughline engines
      - name: build the image and smoke-test it
        run: |
          docker build -t throughline:smoke .
          docker run --rm throughline:smoke python -m throughline demo
          docker run --rm throughline:smoke python -m throughline engines
      - name: release notes from CHANGELOG
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*
            notes.md
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rakshit-737/throughline-security-knowledge-graph:${{ github.ref_name }}
            ghcr.io/rakshit-737/throughline-security-knowledge-graph:latest
          labels: |
            org.opencontainers.image.source=https://github.com/rakshit-737/throughline-security-knowledge-graph
            org.opencontainers.image.description=Evidence-first security knowledge graph
            org.opencontainers.image.licenses=MIT
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "THROUGHLINE $GITHUB_REF_NAME" --notes-file notes.md
