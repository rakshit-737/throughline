# THROUGHLINE API + investigation console, published on 127.0.0.1 only.
#   docker compose up --build                      # synthetic demo world at http://127.0.0.1:8000/ui
# The server binds 0.0.0.0 *inside* the container; without THROUGHLINE_API_TOKEN it then generates
# a random token at startup and prints the console URL (with #token=...) to the logs.
# Optional Neo4j mirror: add -f docker-compose.neo4j.yml (needs NEO4J_PASSWORD).
services:
  throughline:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # localhost only
    environment:
      THROUGHLINE_API_TOKEN: ${THROUGHLINE_API_TOKEN:-}   # empty: a random token is generated and logged
    volumes:
      - ${THROUGHLINE_DATA:-../../datasets/throughline}:/data:ro
    # to serve a real capture instead of the synthetic demo:
    # command: ["python", "-m", "throughline", "serve", "--host", "0.0.0.0", "--capture", "SDWIN-201018195009"]
